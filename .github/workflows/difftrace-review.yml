# Caller template for the difftrace review workflow
# (dch-labs/difftrace/.github/workflows/review.yml). Copy verbatim; on
# every difftrace release, bump the ref in the uses: line below —
# release.sh pins in the difftrace repo prints the exact line: a fixed
# commit carrying the release's binary version+checksum pins.
name: difftrace review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
      model:
        description: "Model to review with"
        required: false

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    concurrency:
      # One lane per pull request: a newer trigger supersedes an older run
      # of the same PR instead of queueing behind it — the superseded run
      # would only re-review the same final head. Command preservation
      # inside the lane needs the callee's own queue and cannot be
      # expressed from the caller side.
      group: difftrace-${{ inputs.pr || github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    uses: dch-labs/difftrace/.github/workflows/review.yml@704613b81fbb484964052c57e4bd2891cc5ebd16 # v0.9.0
    with:
      pr: ${{ inputs.pr }}
      model: ${{ inputs.model }}
    secrets:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
      DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
