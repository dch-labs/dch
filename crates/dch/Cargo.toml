[package]
name = "dch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A terminal-based agentic coding assistant built on loopctl"
autotests = false

[[bin]]
name = "dch"
path = "src/main.rs"

[[test]]
name = "force_quit"

[[test]]
name = "release_gate"

[[test]]
name = "smoke"

[dependencies]
dch-loop = { workspace = true }
dch-tui = { workspace = true }
dch-config = { workspace = true }
loopctl    = { workspace = true }
clap       = { workspace = true }
tokio      = { workspace = true, features = ["signal", "net", "io-util"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid       = { workspace = true }
toml       = { workspace = true }
chrono     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tempfile   = { workspace = true }

[dev-dependencies]
libc        = { workspace = true }
portable-pty = { workspace = true }

[lints]
workspace = true
