[package]
name = "dch-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ratatui terminal UI for dch: themes, markdown rendering, streaming, TuiObserver"

[dependencies]
loopctl                = { workspace = true }
dch-config             = { workspace = true }
ratatui                = { workspace = true }
crossterm              = { workspace = true }
event-listener         = { workspace = true }
chrono                 = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
pest                   = "2.8"
pest_derive            = "2.8"
unicode-width          = "0.1"
tree-sitter            = { version = "0.26", optional = true }
tree-sitter-highlight  = { version = "0.26", optional = true }
tree-sitter-language   = { version = "0.1", optional = true }
tree-sitter-bash       = { version = "0.25", optional = true }
tree-sitter-c          = { version = "0.24", optional = true }
tree-sitter-cpp        = { version = "0.23", optional = true }
tree-sitter-css        = { version = "0.25", optional = true }
tree-sitter-diff       = { version = "0.1", optional = true }
tree-sitter-elixir     = { version = "0.3", optional = true }
tree-sitter-go         = { version = "0.25", optional = true }
tree-sitter-html       = { version = "0.23", optional = true }
tree-sitter-java       = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json       = { version = "0.24", optional = true }
tree-sitter-lua        = { version = "0.5", optional = true }
tree-sitter-ocaml      = { version = "0.24", optional = true }
tree-sitter-php        = { version = "0.24", optional = true }
tree-sitter-python     = { version = "0.25", optional = true }
tree-sitter-rust       = { version = "0.24", optional = true }
tree-sitter-scala      = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml       = { version = "0.7", optional = true }

[features]
default = ["syntax-highlight"]
syntax-highlight = [
    "tree-sitter",
    "tree-sitter-highlight",
    "tree-sitter-language",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-elixir",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-lua",
    "tree-sitter-ocaml",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
]

[lints]
workspace = true
