[package]
name = "dch-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Composition layer for dch: loop, provider factory, system prompt, observers"

[dependencies]
loopctl = { workspace = true, features = ["ollama", "openai", "anthropic", "gemini", "redaction", "azure", "moonshot", "bedrock", "mcp"] }
dch-tools = { workspace = true }
dch-config = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rmcp = { version = "3", default-features = false, features = ["server", "macros"] }
tempfile = { workspace = true }
loopctl = { workspace = true, features = ["testing"] }

[lints]
workspace = true
